<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Globe circle outline -->
  <circle cx="52" cy="52" r="38" fill="none" stroke="#6B7280" stroke-width="2.5"/>

  <!-- Globe latitude lines -->
  <ellipse cx="52" cy="52" rx="18" ry="38" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <ellipse cx="52" cy="52" rx="38" ry="14" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="14" y1="52" x2="90" y2="52" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="52" y1="14" x2="52" y2="90" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Bar chart bars (navy blue) -->
  <rect x="33" y="62" width="8" height="14" rx="1" fill="#1E3A8A"/>
  <rect x="44" y="52" width="8" height="24" rx="1" fill="#1E3A8A"/>
  <rect x="55" y="42" width="8" height="34" rx="1" fill="#1E3A8A"/>
  <rect x="66" y="30" width="8" height="46" rx="1" fill="#1E3A8A"/>

  <!-- Arrow line going up-right -->
  <line x1="28" y1="76" x2="85" y2="20" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="85,20 72,22 83,31" fill="#1E3A8A"/>
</svg>
